# J.A.R.V.I.S. local server — trial configuration for a checkout on one machine.
#
# data_dir is resolved relative to this file, so it lands in <repo>/var/jarvis, which is
# already ignored by git. Nothing here contains a secret: export JARVIS_SERVER_SECRET first.
#
#   export JARVIS_SERVER_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
#   python3 -m app.jarvis check-config --config app/deploy/config.trial.toml
#   python3 -m app.jarvis migrate      --config app/deploy/config.trial.toml
#   python3 -m app.jarvis operator     --config app/deploy/config.trial.toml
#   python3 -m app.jarvis serve        --config app/deploy/config.trial.toml

[server]
bind = "127.0.0.1"
port = 7420
request_timeout_s = 30
max_request_bytes = 1048576

[storage]
data_dir = "../../var/jarvis"
database = "jarvis.sqlite3"
audio_retention_days = 7
max_audio_bytes_per_session = 20000000
max_audio_chunk_bytes = 1048576
audio_session_ttl_minutes = 15

[auth]
device_token_ttl_days = 90
operator_token_ttl_days = 30
pairing_code_ttl_minutes = 10
pairing_max_failed_attempts = 5
secret_file = ""

[external_services]
web_retrieval = false
telephony = false
device_vendor_cloud = false
update_downloads = false

[adapters]
speech_asr = "unavailable"
speech_tts = "unavailable"

# Reminder delivery is a local per-client queue: the server never pushes, speaks or displays
# anything. Every stored instant is UTC; display_timezone is used only to render a wall clock for a
# human, and it is resolved on this host from the IANA database, never fetched over the network.
[reminders]

# REQUIRED — choose the home display time zone and put its IANA name here. There is deliberately no
# default: an empty value is refused at startup with an explanation rather than silently rendering
# reminders in UTC. Take the name from this host (`timedatectl show -p Timezone`, or a file under
# /usr/share/zoneinfo) instead of copying one from a document — no zone is assumed for the owner.
display_timezone = ""

# Seconds after a reminder's scheduled time at which the server labels a hand-over "late". This is a
# label the server applies to its own hand-over delay. It is NOT the time until a client shows the
# reminder: the owner's 10-second figure is a client polling cadence, it has not been measured, and
# no client application exists.
late_after_seconds = 10

# Still-unapproved placeholders: the owner has explicitly declined to approve these numbers. Keep
# them configurable; do not read them as requirements.
max_delivery_attempts = 3
retry_interval_minutes = 5
delivery_window_minutes = 1440

[logging]
level = "info"
